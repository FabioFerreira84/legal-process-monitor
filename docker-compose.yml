services:
  legal-monitor-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-process-monitor-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - TZ=America/Sao_Paulo
      - Sqlite__DatabasePath=/app/data/legalmonitor.db
      - DataJud__ApiKey=${DATAJUD_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200,https://fabioferreira84.github.io}
    volumes:
      - sqlite_saas_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_saas_data:
    driver: local
