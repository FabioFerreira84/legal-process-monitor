name: CI Quality Gates (.NET 9 & Angular 21)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend-dotnet:
    name: Backend .NET 9 (Build & xUnit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore LegalProcessMonitor.sln

      - name: Build Solution
        run: dotnet build LegalProcessMonitor.sln --configuration Release --no-restore

      - name: Run xUnit Test Suite (42+ tests)
        run: dotnet test tests/LegalProcessMonitor.Tests/LegalProcessMonitor.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend-angular:
    name: Frontend Angular 21 (Unit Tests & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Forensic Calculator & RFC 5545 .ICS Unit Tests
        run: |
          cd frontend
          npx tsx --test src/app/utils/calculadora-prazo.spec.ts

      - name: Production Build Verification
        run: |
          cd frontend
          npm run build
