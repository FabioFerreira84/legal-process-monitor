name: Keep Backend Alive

on:
  schedule:
    # Executa a cada 10 minutos para evitar o Cold Start do Render Free Tier
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite disparo manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Legal Process Monitor API on Render
        run: |
          echo "Pinging Render backend to keep instance warm..."
          curl -sI -m 20 "https://legal-process-monitor-api.onrender.com/api/processos/ping" || true
          echo "Keep-alive ping sent."
